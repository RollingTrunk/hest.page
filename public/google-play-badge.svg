<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 135 40" width="135" height="40">
  <!-- Badge background -->
  <rect width="135" height="40" rx="5" fill="#000"/>
  <rect x="0.5" y="0.5" width="134" height="39" rx="4.5" fill="none" stroke="#a6a6a6" stroke-width="1"/>

  <!-- Text: GET IT ON -->
  <text fill="#fff" font-family="'Product Sans','Roboto',Arial,Helvetica,sans-serif" font-size="5.5" letter-spacing="0.5" x="47" y="13">GET IT ON</text>

  <!-- Text: Google Play -->
  <text fill="#fff" font-family="'Product Sans','Roboto',Arial,Helvetica,sans-serif" font-size="13" font-weight="500" x="46.5" y="28">Google Play</text>

  <!-- Play triangle icon -->
  <g transform="translate(12, 7.5)">
    <defs>
      <linearGradient id="gp-blue" x1="0" y1="0" x2="0.7" y2="0.7" gradientUnits="objectBoundingBox">
        <stop offset="0" stop-color="#00c3ff"/>
        <stop offset="1" stop-color="#00a0ff"/>
      </linearGradient>
      <linearGradient id="gp-green" x1="0" y1="1" x2="0.7" y2="0.3" gradientUnits="objectBoundingBox">
        <stop offset="0" stop-color="#00f076"/>
        <stop offset="1" stop-color="#32a071"/>
      </linearGradient>
      <linearGradient id="gp-yellow" x1="1" y1="0.5" x2="0" y2="0.5" gradientUnits="objectBoundingBox">
        <stop offset="0" stop-color="#ffe000"/>
        <stop offset=".4" stop-color="#ffbd00"/>
        <stop offset="1" stop-color="#ff9c00"/>
      </linearGradient>
      <linearGradient id="gp-red" x1="0.5" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
        <stop offset="0" stop-color="#ff3a44"/>
        <stop offset="1" stop-color="#c31162"/>
      </linearGradient>
    </defs>
    <!-- Blue: left side -->
    <path d="M0.7,3.5V21.5L12.5,13.5v-0.3L0.7,3.5Z" fill="url(#gp-blue)"/>
    <!-- Yellow: right tip -->
    <path d="M16.4,17.4L12.5,13.5v-0.3l3.9-3.9l0.1,0.1l4.6,2.6c1.3,0.7,1.3,1.9,0,2.7l-4.6,2.6Z" fill="url(#gp-yellow)"/>
    <!-- Red: bottom-left to center to right -->
    <path d="M16.5,17.3L12.5,13.3L0.7,21.5l0,1.3c0,0.5,0.3,0.8,0.7,1.0c0.5,0.2,1.0,0.1,1.5-0.2l13.1-7.2Z" fill="url(#gp-red)"/>
    <!-- Green: top-left to center to right -->
    <path d="M16.5,9.6L3.4,2.4c-0.5-0.3-1.0-0.4-1.5-0.2C1.4,2.4,1.0,2.7,0.7,3.2L0.7,3.5L12.5,13.6l4-4Z" fill="url(#gp-green)"/>
  </g>
</svg>
